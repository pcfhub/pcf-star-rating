<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A star.

       The one mark in this set that gets no container. A star on a card was
       drawn and it is a perfectly good icon for "a rating field", but the star
       is already unmistakable at 16px and the card only made it smaller. The
       control is a numeric column shown as a rating; the star is the rating.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. It is filled AND stroked with the same ramp at width 7,
       which rounds the five points and the five inner angles without a second
       path: unrounded, the points thin to nothing and the star acquires a
       ragged edge by 24.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="star-rating-ramp" x1="10" y1="84" x2="86" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- Fill and stroke are the same paint. The stroke is only there to round
       the corners. -->
  <path d="M48 10 L57.4 37.1 L86 37.6 L63.2 54.9 L71.5 82.4 L48 66 L24.5 82.4 L32.8 54.9 L10 37.6 L38.6 37.1 Z"
        fill="url(#star-rating-ramp)" stroke="url(#star-rating-ramp)" stroke-width="7" stroke-linejoin="round"/>
</svg>
